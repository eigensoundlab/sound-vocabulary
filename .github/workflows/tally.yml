# Counts the term choices sent from the review sheet (issues titled "Term choices") into docs/votes.json.
name: Tally term choices

on:
  issues:
    types: [opened, edited, closed, reopened, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: tally
  cancel-in-progress: false

jobs:
  tally:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'Term choices')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 tools/tally.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit the tallies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/votes.json
          git diff --cached --quiet || { git commit -m "Tally term choices" && git push; }
